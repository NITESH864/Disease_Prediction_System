services:
  - type: web
    name: disease-prediction-system
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: gunicorn dp_project.wsgi:application
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        sync: false
      - key: ALLOWED_HOSTS
        value: disease-prediction-system.onrender.com
      - key: PYTHON_VERSION
        value: "3.11.9"
